<!doctype html>
<html lang="ru" dir="ltr">

<head>
  <!-- Basic Meta Tags -->
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />

  <!-- SEO Meta Tags -->
  <title>Slotly - Система онлайн-бронирования</title>
  <meta name="description"
    content="Slotly - современная система онлайн-бронирования для управления расписанием и записями клиентов" />
  <meta name="keywords" content="бронирование, онлайн-запись, расписание, система управления, слоты" />
  <meta name="author" content="Slotly" />
  <meta name="robots" content="index, follow" />
  <meta name="language" content="Russian" />

  <!-- Theme and Colors -->
  <meta name="theme-color" content="#4DABF7" />
  <meta name="msapplication-TileColor" content="#4DABF7" />
  <meta name="msapplication-config" content="/browserconfig.xml" />

  <!-- Apple Mobile Web App -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Slotly" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Slotly - Система онлайн-бронирования" />
  <meta property="og:description"
    content="Современная система онлайн-бронирования для управления расписанием и записями клиентов" />
  <meta property="og:site_name" content="Slotly" />
  <meta property="og:locale" content="ru_RU" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Slotly - Система онлайн-бронирования" />
  <meta name="twitter:description"
    content="Современная система онлайн-бронирования для управления расписанием и записями клиентов" />

  <!-- Security -->
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()" />

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon.svg" />
  <link rel="mask-icon" href="/favicon.svg" color="#4DABF7" />

  <!-- Preconnect for Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Google Fonts - Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Canonical URL (will be set dynamically if needed) -->
  <!-- <link rel="canonical" href="https://slotly.com" /> -->
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/app/main.tsx"></script>
</body>

</html>
